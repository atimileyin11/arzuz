# Arzuz — Netlify configuration
## Configure environment variables in Netlify Dashboard:
#   Site settings -> Environment variables:
#   CLOUDINARY_API_KEY
#   CLOUDINARY_API_SECRET
#   CLOUDINARY_CLOUD_NAME
#   OPENWA_URL
#   OPENWA_API_KEY
#   OPENWA_SESSION
#   TELEGRAM_BOT_TOKEN     (never added to any page source)
#   TELEGRAM_CHAT_ID       (get it from /api/notify → action: detect)

[build]
  publish = "."
  # listing-og.js reads listing.html from the function sandbox to inject
  # per-listing preview tags — this bundles the page into the deploy.
  included_files = ["netlify/functions/**", "listing.html"]

# Link-preview cards: scrapers (WhatsApp, X, iMessage) never run JS,
# so /listing is served by a function that writes the real listing's
# tags into the head before the page ships. Query string is preserved.
[[redirects]]
  from = "/listing"
  to   = "/.netlify/functions/listing-og"
  status = 200

[[redirects]]
  from = "/listing.html"
  to   = "/.netlify/functions/listing-og"
  status = 200

# Clean URLs: /register instead of /register.html
[[redirects]]
  from = "/register"
  to   = "/register.html"
  status = 200

[[redirects]]
  from = "/list"
  to   = "/owner-list.html"
  status = 200

[[redirects]]
  from = "/browse"
  to   = "/browse.html"
  status = 200

[[redirects]]
  from = "/my-building"
  to   = "/scout.html"
  status = 200

[[redirects]]
  from = "/safety"
  to   = "/safety.html"
  status = 200

[[redirects]]
  from = "/care"
  to   = "/care.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to   = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to   = "/terms.html"
  status = 200

# API routes → Netlify Functions
[[redirects]]
  from = "/api/*"
  to   = "/.netlify/functions/:splat"
  status = 200

# Never cache config — you will change the session and keys.
# The dashboard is private: not indexed, never cached.
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/config.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
