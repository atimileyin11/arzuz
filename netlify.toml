# Arzuz — Netlify configuration
## Configure environment variables in Netlify Dashboard:
#   Site settings -> Environment variables:
#   CLOUDINARY_API_KEY
#   CLOUDINARY_API_SECRET
#   CLOUDINARY_CLOUD_NAME
#   OPENWA_URL
#   OPENWA_API_KEY
#   OPENWA_SESSION
#   TELEGRAM_BOT_TOKEN     (never added to any page source)
#   TELEGRAM_CHAT_ID       (get it from /api/notify → action: detect)
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / YOUTUBE_REFRESH_TOKEN
#                          (video tours upload to unlisted YouTube videos —
#                           one-time setup: SETUP.md → scripts/youtube-auth.mjs)

[build]
  publish = "."
  # 404.html needs no redirect rule: Netlify serves it automatically at every
  # missing URL. It uses root-absolute paths (/assets/…) because the failed
  # path is preserved in the browser — /a/b/missing must still load CSS.
  # listing-og.js reads listing.html from the function sandbox to inject
  # per-listing preview tags; strategy-docs.js serves the strategy pack
  # to signed-in team members only. Both bundle their files into the deploy.
  included_files = ["netlify/functions/**", "listing.html", "strategy/*.md"]

# Repo files that are NOT part of the website. `publish = "."` means Netlify
# will happily serve any of them as plain text — and it was: supabase-hardening.sql
# and supabase-media-booking.sql were both publicly readable, handing anyone the
# complete RLS design, the table shapes and the admin model in one fetch. The
# database is the real boundary (see supabase-team-roles.sql); this simply stops
# the map from being handed out with it. None of these paths is requested by the
# live site, and the dev harnesses are meant to run on localhost (they are
# localhost-guarded anyway).
# Netlify path patterns cannot wildcard mid-segment (`/*.sql` does NOT match
# /supabase-schema.sql — only a trailing /* does), so each SQL file is listed.
# ADD A LINE HERE WHEN YOU ADD A supabase-*.sql FILE. Verified on the live site:
# every one of these must answer 404, or the whole RLS design is public.
[[redirects]]
  from = "/supabase-schema.sql"
  to   = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase-hardening.sql"
  to   = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase-team-roles.sql"
  to   = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase-drafts-support.sql"
  to   = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase-draft-sharing.sql"
  to   = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase-media-booking.sql"
  to   = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase-location.sql"
  to   = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase-public-view.sql"
  to   = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/dev/*"
  to   = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to   = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to   = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/SETUP.md"
  to   = "/404.html"
  status = 404
  force = true

# Link-preview cards: scrapers (WhatsApp, X, iMessage) never run JS,
# so /listing is served by a function that writes the real listing's
# tags into the head before the page ships. Query string is preserved.
[[redirects]]
  from = "/listing"
  to   = "/.netlify/functions/listing-og"
  status = 200

[[redirects]]
  from = "/listing.html"
  to   = "/.netlify/functions/listing-og"
  status = 200

# Draft invite link page: no login — the secret ?ref= token is the key.
[[redirects]]
  from = "/complete-listing"
  to   = "/complete-listing.html"
  status = 200

# Private strategy API: the dashboard fetches docs here with the
# signed-in Supabase token (assets/strategy.js). Without a valid
# session the function itself returns 401.
[[redirects]]
  from = "/strategy-docs"
  to   = "/.netlify/functions/strategy-docs"
  status = 200

# The strategy pack is business IP — never public. Force a real 404
# for every direct path (the files still deploy, but only reach a
# browser through the authenticated /strategy-docs function).
[[redirects]]
  from = "/strategy/*"
  to   = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/strategy"
  to   = "/404.html"
  status = 404
  force = true

# Clean URLs: /register instead of /register.html
[[redirects]]
  from = "/register"
  to   = "/register.html"
  status = 200

[[redirects]]
  from = "/list"
  to   = "/owner-list.html"
  status = 200

[[redirects]]
  from = "/browse"
  to   = "/browse.html"
  status = 200

[[redirects]]
  from = "/my-building"
  to   = "/scout.html"
  status = 200

[[redirects]]
  from = "/safety"
  to   = "/safety.html"
  status = 200

[[redirects]]
  from = "/care"
  to   = "/care.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to   = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to   = "/terms.html"
  status = 200

# API routes → Netlify Functions
[[redirects]]
  from = "/api/*"
  to   = "/.netlify/functions/:splat"
  status = 200

# Never cache config — you will change the session and keys.
# The dashboard is private: not indexed, never cached.
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# The draft invite page is per-link, never for search engines.
[[headers]]
  for = "/complete-listing.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets/config.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# JS files change without a build step, so browsers must revalidate them on
# every visit — a hard-cached submit.js delayed the last fix for up to a week
# for returning visitors (304 responses keep this cheap).
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
