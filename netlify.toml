# Arzuz — Netlify configuration
## Configure environment variables in Netlify Dashboard:
#   Site settings -> Environment variables:
#   CLOUDINARY_API_KEY
#   CLOUDINARY_API_SECRET
#   CLOUDINARY_CLOUD_NAME
#   OPENWA_URL
#   OPENWA_API_KEY
#   OPENWA_SESSION
#   OPENWA_WEBHOOK_SECRET (the secret on the OpenWA webhook pointed at
#                           /api/wa-inbound — the same value OpenWA signs
#                           each delivery with. It is the only thing that
#                           makes a worker's "yes"/"no" to a handover
#                           trustworthy; without it that function refuses
#                           every request. One-time setup: SETUP.md →
#                           Step 4b-3.)
#   PAYSTACK_SECRET_KEY    (the money core — Paystack secret key, server-side only;
#                           without it every payment write answers 503 not-ready)
#   TELEGRAM_BOT_TOKEN     (never added to any page source)
#   TELEGRAM_CHAT_ID       (get it from /api/notify → action: detect)
#   INDEXNOW_HOOK_SECRET   (the shared secret Supabase's database webhook sends
#                           in the x-arzuz-hook header to /api/listing-live, so
#                           the moment a listing goes live its /rooms/<slug> URL
#                           is pushed to IndexNow. One-time setup: SEO.md → §5.
#                           Without it that function refuses every request.)
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / YOUTUBE_REFRESH_TOKEN
#                          (video tours upload to unlisted YouTube videos —
#                           one-time setup: SETUP.md → scripts/youtube-auth.mjs)

# ONE message a day, at 06:00 UTC (07:00 in Lagos): the last 24 hours of
# roommate activity, plus any match older than three days that NEITHER
# student has opened. A quiet day sends nothing.
#
# The cron lives in this file rather than inline in the function because
# Netlify's inline `export const config` needs an ES module, and every
# function in this repo is CommonJS. A missing schedule here is silent:
# the function still deploys, it just never runs. See
# netlify/functions/roommate-digest.js.
# EVERY HALF HOUR: is media upload still switched on? The failure this
# catches ran for weeks — /api/cloudinary-sign answering 200 while
# every upload was refused 401 "Invalid Signature", and the first
# person to notice was a landlord adding an apartment.
# netlify/functions/upload-health.js signs on this deployment and asks
# Cloudinary to accept the signature with no file attached (400
# "Missing required parameter - file" means accepted, 401 means
# rejected), then tampers with it once and requires a 401 — so a probe
# that cannot see a bad signature cannot report a green one. It stores
# nothing and pages the team through sendAlert when it fails.
#
# A missing schedule here is silent: the function still deploys, it
# just never runs. That is the same class of failure it exists to
# catch, which is why the line is not left to memory.
[functions."upload-health"]
  schedule = "*/30 * * * *"

# EVERY HOUR, ON THE HOUR: can this deploy still do the three things that
# pay and page?
# The failure this catches ran for an afternoon — SUPABASE_SERVICE_ROLE_KEY
# SET and refused by Supabase (rotated upstream, or an anon key in the
# service slot), so every form, the Care panel and the checkout answered
# "not switched on yet" to people who could not fix it while every page
# rendered. netlify/functions/database-health.js reads a private table
# with the key this deployment was built with, repeats the read with one
# byte changed and requires a refusal — so a probe that cannot see a bad
# key cannot report a green one — then calls /api/finance and
# /api/care-credit, because the key can be right and the deploy wrong.
#
# The same hour asks the other two providers the build gate only asks at
# build time: Paystack GET /balance with the secret key (a refused 401 =
# every Care Pass checkout answering 502), and Telegram getMe then getChat
# (a dead token, or a bot that cannot see the alert chat, is a silent
# pager). Absence warns at build time and is skipped here; a REFUSED value
# pages, because the deploy looks healthy while it is not.
#
# When Telegram itself is the failing check, sendAlert is the dead
# channel: that one alert falls back to email if ARZUZ_ALERT_EMAIL is set
# (optional — without it the stage is in the function log only).
#
# It says nothing while everything is fine, so a recovery used to happen in
# silence: the last message the team got was "broken". Each healthy hour now
# records ONE timestamp PER CHECK (lib/health-state.js, a single
# ops_database_health row in finance_config — the one key/value table this
# key can write without a new migration) and a check that finds a gap over
# ninety minutes is announced. Checks that came back in the same hour share
# ONE message, so a total outage is one notice. A failing check's timestamp
# is left alone, so its gap survives and the notice cannot fire twice for
# one outage; the checks that DID pass still record theirs, so a long
# Paystack outage cannot invent a database recovery later.
#
# A missing schedule here is silent: the function still deploys, it
# just never runs. That is the same class of failure it exists to
# catch, which is why the line is not left to memory.
[functions."database-health"]
  schedule = "0 * * * *"

# EVERY QUARTER HOUR: send what the waitlist door queued. The browser
# used to announce a save that only it knew about, so a closed page
# left a saved row with nobody told. The door now queues the
# announcement in alert_outbox beside the row (supabase-alert-outbox.sql)
# and this drain delivers it with retries and the shared ceiling —
# fifteen minutes is the oldest an announcement waits.
#
# A missing schedule here is silent: the function still deploys, rows
# queue, and nothing ever sends them. That is the same class of failure
# the other schedules above document, which is why the line is not left
# to memory.
[functions."alert-drain"]
  schedule = "*/15 * * * *"

[functions."roommate-digest"]
  schedule = "0 6 * * *"

# EVERY HOUR, ON THE HOUR: the claim aging clock. A claim that has stood
# in one status past the deadline for that status pages the team ONCE per
# crossing — the queue's own ordering only helps whoever opens it.
# netlify/functions/claims-aging.js writes an 'overdue_nudge' row to the
# claim's trail, which is what keeps it from repeating every hour.
#
# The same silence rule as above applies: a missing schedule deploys fine
# and never runs.
[functions."claims-aging"]
  schedule = "0 * * * *"

# EVERY HOUR, ON THE HOUR: the verification clock. A live listing nobody
# has visited, or one an officer took and went quiet on, pages the team
# ONCE per lateness — and a job that was nudged and stayed silent for
# POLICY.reclaim_after_hours goes back to the queue by itself
# (netlify/functions/verification-aging.js). The queue's own ordering
# only helps whoever opens the dashboard.
#
# The policy lives in assets/verification-queue.js, which this function
# and the dashboard both load — one copy of "48 hours", so the page and
# the message cannot disagree about whether a listing is late. The same
# silence rule as above applies: a missing schedule deploys fine and
# never runs.
[functions."verification-aging"]
  schedule = "0 * * * *"

# ONE message a day, at 07:00 UTC (08:00 in Lagos): the visits that have
# not happened yet, and how many of them are actually pinned down —
# agreed versus still being haggled over between the worker and the
# customer, with each day quoted in the words of the person who said it.
# A quiet day sends nothing: everything agreed and nothing moved is not
# news, and a daily "all fine" is how a team learns to ignore a channel.
#
# An hour after roommate-digest, so the two do not arrive together. The
# same silence rule applies: a missing schedule deploys fine and never
# runs. See netlify/functions/claims-digest.js.
[functions."claims-digest"]
  schedule = "0 7 * * *"

[build]
  # THE GATE THAT MAKES A DEPLOY THAT CANNOT KEEP A PROMISE IMPOSSIBLE.
  #
  # Five credentials, and each one fails the same way when it is missing:
  # NOTHING looks broken. There is no crash to notice — only a person who was
  # told their request was received and then never heard anything again.
  #
  #   SUPABASE_SERVICE_ROLE_KEY
  #     supabase-close-public-inserts.sql revoked anon's INSERT on the five
  #     public tables and assets/submit.js deleted the fallback, so
  #     /api/waitlist is the only way a public form reaches the database.
  #     Without the key the door answers 503, the page holds the answers in
  #     the student's browser, and a student who never comes back is a lead
  #     nobody sees.
  #
  #   OPENWA_URL / OPENWA_API_KEY
  #     Every confirmation, coverage and dispute notice goes out over OpenWA
  #     — and so does the six-digit code the status page depends on. Without
  #     them the code is ISSUED and never delivered: the student waits at a box
  #     that stays empty, and the notice is recorded as unsent in a trail
  #     nobody is reading. See netlify/functions/status.js.
  #
  # OPENWA_SESSION, RESEND_API_KEY, PAYSTACK_SECRET_KEY and TELEGRAM_BOT_TOKEN /
  # TELEGRAM_CHAT_ID are on the script's ADVISED list: their absence degrades
  # the site rather than breaking a promise (WhatsApp still delivers; the second
  # email channel goes quiet; the Care Pass is legitimately off sale until its
  # terms are published; the ops pager is not configured yet). Those are
  # warnings, and they never fail the build — a gate that fails on a preference
  # is a gate people learn to override. A value that is PRESENT and refused is a
  # different fact, and that one does fail the build.
  #
  # So the build refuses. A failed build does not publish, which is what leaves
  # the last working deploy live rather than exposing students to one that
  # cannot store their answer or deliver their code. The script prints no part
  # of any value, and it names the two causes it cannot tell apart from inside
  # a build — the variable was never set, or it was scoped to "Functions" only
  # — so a correctly-scoped project is a one-minute fix rather than a mystery.
  #
  # AND IT TRIES THE VALUES, NOT JUST THE NAMES. A ROTATED key is SET: the
  # name-check above passes, the deploy ships, and every door answers "not
  # switched on yet" to someone who cannot fix it. So the same command proves
  # each credential against the provider that has to accept it — one read of a
  # private table, GET /api/sessions on the OpenWA server, a POST to Resend
  # whose body cannot send anything, GET /balance on Paystack, and getMe +
  # getChat on Telegram — then repeats each request with one byte changed and
  # REQUIRES a refusal, so a green cannot be vacuous. A value the provider
  # refuses fails the build. A value the build cannot ask about (a network
  # minute, a 403 from a key's IP allowlist, an older OpenWA without that
  # route, a Telegram token of the wrong shape) warns and does NOT fail it: a
  # gate that blocks on where the build runs is a gate people learn to override.
  #
  # A deploy that is deliberately going out without the door can say so with
  # ARZUZ_ALLOW_MISSING_ENV=1 (everything) or ARZUZ_ALLOW_MISSING_ENV=OPENWA_URL
  # (exactly that one). It is logged as a warning. This command does NOT carry
  # that override, and scripts/test-deploy-key.mjs fails the build if it ever
  # does.
  command = "node scripts/require-service-key.mjs --require"

  publish = "."
  # 404.html needs no redirect rule: Netlify serves it automatically at every
  # missing URL. It uses root-absolute paths (/assets/…) because the failed
  # path is preserved in the browser — /a/b/missing must still load CSS.
  # listing-og.js reads listing.html from the function sandbox to inject
  # per-listing preview tags; strategy-docs.js serves the strategy pack
  # to signed-in team members only. Both bundle their files into the deploy.
  # What the functions read at runtime has to be bundled with them. rooms.js
  # serves listing.html with a listing already written into it, and answers an
  # unknown room with the real 404 page and a real 404 status — a page that
  # says "not found" while answering 200 is a soft 404, and it tells a crawler
  # the page exists.
  #
  # assets/listing-url.js is loaded, not copied: it is the one place that knows
  # a listing's address and the walk to campus, and browse.html, listing.html
  # and both new functions read the same file.
  # browse.html and assets/indexnow.js are the two newest readers:
  # netlify/functions/browse.js writes the room links into browse.html
  # before the page ships, and netlify/functions/listing-live.js posts to
  # IndexNow through the same module the CLI uses.
  #
  # The IndexNow key file is named here, not globbed, ON PURPOSE: its
  # FILE NAME is the key, so an explicit line is the only form that can be
  # checked. scripts/test-seo.mjs fails the build when the key file in the
  # root is not the one this line names, which is what happens the day
  # somebody rotates the key by creating a new file.
  included_files = ["netlify/functions/**", "listing.html", "browse.html", "404.html", "assets/listing-url.js", "assets/verification-badge.js", "assets/listing-score.js", "assets/indexnow.js", "8e15f62cc98636edef91c1ba76943ebb.txt", "strategy/*.md"]

# Strip .html from every page URL. Netlify already serves browse.html at /browse etc.;
# this redirect kills the ugly /*.html version permanently.
# force = true is required because the .html files physically exist — without it
# Netlify serves the file directly instead of applying the redirect.
[[redirects]]
  from   = "/*.html"
  to     = "/:splat"
  status = 301
  force  = true

# Repo files that are NOT part of the website. `publish = "."` means Netlify
# serves every file in root as a public URL. SQL migrations, docs, and dev
# tooling are blocked here so the schema design and operational notes stay private.

# All SQL migrations — moved to supabase/migrations/ (one rule covers all of them)
[[redirects]]
  from = "/supabase/*"
  to   = "/404.html"
  status = 404
  force = true

# Dev tooling and scripts
[[redirects]]
  from = "/dev/*"
  to   = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to   = "/404.html"
  status = 404
  force = true

# Documentation (moved to docs/)
[[redirects]]
  from = "/docs/*"
  to   = "/404.html"
  status = 404
  force = true

# Root markdown (README.md stays at root)
[[redirects]]
  from = "/README.md"
  to   = "/404.html"
  status = 404
  force = true

# Config files
[[redirects]]
  from = "/netlify.toml"
  to   = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to   = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to   = "/404.html"
  status = 404
  force = true

# Link-preview cards: scrapers (WhatsApp, X, iMessage) never run JS,
# so /listing is served by a function that writes the real listing's
# tags into the head before the page ships. Query string is preserved.
# (/listing.html is a 301 to this path, in the canonical block below —
#  two live addresses for one listing is exactly what that block ends.)
[[redirects]]
  from = "/listing"
  to   = "/.netlify/functions/listing-og"
  status = 200

# Draft invite link page: no login — the secret ?ref= token is the key.
[[redirects]]
  from = "/complete-listing"
  to   = "/complete-listing.html"
  status = 200
# A listing's own address, and the page that serves it. The function writes
# the room into the HTML, so /rooms/anything is answered by it whatever the
# slug says: it decides whether the slug is the current one (301 to the
# current one, if the property has been renamed) or whether there is no such
# room at all (a real 404). See netlify/functions/rooms.js.
[[redirects]]
  from = "/rooms/*"
  to   = "/.netlify/functions/rooms"
  status = 200

# The listing half of the sitemap, generated from the database. Separate from
# sitemap.xml — the ten hand-maintained pages — so a Supabase failure cannot
# take them down with it. robots.txt lists both.
[[redirects]]
  from = "/sitemap-listings.xml"
  to   = "/.netlify/functions/listings-sitemap"
  status = 200

# Private strategy API: the dashboard fetches docs here with the
# signed-in Supabase token (assets/strategy.js). Without a valid
# session the function itself returns 401.
[[redirects]]
  from = "/strategy-docs"
  to   = "/.netlify/functions/strategy-docs"
  status = 200

# The strategy pack is business IP — never public. Force a real 404
# for every direct path (the files still deploy, but only reach a
# browser through the authenticated /strategy-docs function).
[[redirects]]
  from = "/strategy/*"
  to   = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/strategy"
  to   = "/404.html"
  status = 404
  force = true

# Clean URLs: /register instead of /register.html
[[redirects]]
  from = "/register"
  to   = "/register.html"
  status = 200

[[redirects]]
  from = "/list"
  to   = "/owner-list.html"
  status = 200

# The board is served by a FUNCTION, not by the file. /browse is how a
# crawler finds a room at all: every listing now has its own /rooms/<slug>
# address, but the cards that link them were drawn from Supabase after
# load, so the links existed only in JavaScript. netlify/functions/browse.js
# writes them into the HTML before the page ships — and still serves the
# same page when the database is unreachable. /browse.html answers a 301
# down in the canonical block below, so the two addresses cannot compete.
[[redirects]]
  from = "/browse"
  to   = "/.netlify/functions/browse"
  status = 200

[[redirects]]
  from = "/my-building"
  to   = "/scout.html"
  status = 200

[[redirects]]
  from = "/safety"
  to   = "/safety.html"
  status = 200

[[redirects]]
  from = "/care"
  to   = "/care.html"
  status = 200

# Buying a pass. A real page with a real address, so it is indexable like
# /care — and the reference in the address after payment is never trusted
# for anything: the page asks the server, and the server asks Paystack.
[[redirects]]
  from = "/care-pass"
  to   = "/care-pass.html"
  status = 200

# Also a private-link page: /roommates?t=… is one student's key, so it
# is never cached and never indexed while a token is present.
[[redirects]]
  from = "/roommates"
  to   = "/roommates.html"
  status = 200

# One student's Care account: /my-care?t=… is the whole credential, and
# unlike /roommates there is no public face of this page at all — so it
# is noindexed in the file itself as well as here.
[[redirects]]
  from = "/my-care"
  to   = "/my-care.html"
  status = 200

# Where a student's own submission has got to. Not private in the way
# /my-care is — there is nothing on it until someone types a reference
# and a number — but it is a page about one person's business, so it is
# noindexed below and deliberately absent from the sitemap.
[[redirects]]
  from = "/status"
  to   = "/status.html"
  status = 200

# The referrer dashboard: code + phone is the whole credential, so like
# /status it is a page about one person's business — noindexed below and
# deliberately absent from the sitemap.
[[redirects]]
  from = "/referrals"
  to   = "/my-referrals.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to   = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to   = "/terms.html"
  status = 200
# The two reading pages. They exist to answer the questions students
# actually search for — what rent costs around KWASU, and what "near
# campus" is worth — which no other page on the site was written for.
[[redirects]]
  from = "/rent-in-malete"
  to   = "/rent-in-malete.html"
  status = 200

[[redirects]]
  from = "/hostels-near-kwasu"
  to   = "/hostels-near-kwasu.html"
  status = 200


# ---- one address per page -------------------------------------------
# Netlify serves both /register and /register.html, and it also answers
# /owner-list and /scout for the landlord and building pages — so the
# landlord page alone had three live URLs. A canonical tag names the one
# that counts, but the copies still compete for the same query and spend
# crawl budget, and crawl budget is the whole game on a site Google has
# not indexed yet. Every duplicate now answers a 301 to the address in
# its own canonical tag and in sitemap.xml.
#
# force = true is required: /register.html is a real file in the deploy,
# and without it Netlify serves the file and never applies the rule.
#
# NOT redirected, deliberately: /admin.html, /complete-listing.html,
# /my-care.html and /my-referrals.html (noindex and private — they already
# carry an X-Robots-Tag header), and /404.html, which Netlify serves at
# every missing path and which would loop if it redirected anywhere.

[[redirects]]
  from = "/index.html"
  to   = "/"
  status = 301
  force = true

[[redirects]]
  from = "/register.html"
  to   = "/register"
  status = 301
  force = true

[[redirects]]
  from = "/browse.html"
  to   = "/browse"
  status = 301
  force = true

[[redirects]]
  from = "/owner-list.html"
  to   = "/list"
  status = 301
  force = true

[[redirects]]
  from = "/owner-list"
  to   = "/list"
  status = 301
  force = true

[[redirects]]
  from = "/scout.html"
  to   = "/my-building"
  status = 301
  force = true

[[redirects]]
  from = "/scout"
  to   = "/my-building"
  status = 301
  force = true

[[redirects]]
  from = "/listing.html"
  to   = "/listing"
  status = 301
  force = true

[[redirects]]
  from = "/roommates.html"
  to   = "/roommates"
  status = 301
  force = true

[[redirects]]
  from = "/safety.html"
  to   = "/safety"
  status = 301
  force = true

[[redirects]]
  from = "/care.html"
  to   = "/care"
  status = 301
  force = true

[[redirects]]
  from = "/care-pass.html"
  to   = "/care-pass"
  status = 301
  force = true

[[redirects]]
  from = "/privacy.html"
  to   = "/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/terms.html"
  to   = "/terms"
  status = 301
  force = true
[[redirects]]
  from = "/rent-in-malete.html"
  to   = "/rent-in-malete"
  status = 301
  force = true

[[redirects]]
  from = "/hostels-near-kwasu.html"
  to   = "/hostels-near-kwasu"
  status = 301
  force = true

[[redirects]]
  from = "/status.html"
  to   = "/status"
  status = 301
  force = true

[[redirects]]
  from = "/my-referrals.html"
  to   = "/referrals"
  status = 301
  force = true


# API routes → Netlify Functions
[[redirects]]
  from = "/api/*"
  to   = "/.netlify/functions/:splat"
  status = 200

# Never cache config — you will change the session and keys.
# The dashboard is private: not indexed, never cached.
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# The draft invite page is per-link, never for search engines.
[[headers]]
  for = "/complete-listing.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# A student's Care balance and ledger: private, and never cached. A
# cached copy would be readable by whoever shares the device next, and a
# shared cache would hand one student's balance to another.
[[headers]]
  for = "/my-care.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# The status page: noindex in the file as well, because the header is the
# copy a crawler is guaranteed to read and the meta tag is the one that
# survives being scraped into something else. NOT no-store — unlike
# /my-care there is nothing of anybody's on it until they act, so
# caching it costs nothing and saves a round trip on the second visit.
[[headers]]
  for = "/status.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# The referrer dashboard: noindex in the file as well, because the header
# is the copy a crawler is guaranteed to read and the meta tag is the one
# that survives being scraped into something else. NOT no-store — like
# /status there is nothing of anybody's on it until they act.
[[headers]]
  for = "/my-referrals.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets/config.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# JS files change without a build step, so browsers must revalidate them on
# every visit — a hard-cached submit.js delayed the last fix for up to a week
# for returning visitors (304 responses keep this cheap).
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

