<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>List Your Property — Arzuz Student Housing Malete</title>
<meta name="description" content="List your student property in Malete on Arzuz. Reach verified students looking for rooms. Free to list, no agent required.">
<link rel="canonical" href="https://arzuz.com/list">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="assets/icons/favicon.ico" sizes="any">
<link rel="icon" href="assets/icons/icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta property="og:title" content="List Your Property — Arzuz Student Housing Malete">
<meta property="og:description" content="List your student property in Malete on Arzuz. Reach verified students looking for rooms.">
<meta property="og:image" content="https://arzuz.com/assets/social/og-image.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="assets/arzuz.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<div class="wrap pad"><div id="form"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/config.js"></script>
<script src="assets/data.js"></script>
<script src="assets/notify.js"></script>
<script src="assets/submit.js"></script>
<script src="assets/whatsapp.js"></script>
<script src="assets/app.js"></script>
<script>

Arzuz.chrome('owner');
Arzuz.form({
  table:'listings',
  backHref:'index.html', backLabel:'\u2190 Back to home',
  steps:[
   {k:'p', h:"About the property",
    hint:"Give us a name for the property if it has one \u2014 helps students recognise it. Everything else is required.",
    f:[["prop_name","Property name or nickname (e.g. Blessing Lodge)","text",{opt:true}],
       ["ty","Property type","sel",["Self-contain","Shared room","Face-me-I-face-you","Hostel","Boys quarters"]],
       ["ar","Street or area name","text"],
       ["rm","Rooms available","number"]]},
   {k:'pin', h:"Where exactly is it?",
    hint:"Drop a pin at your gate. We calculate the walking distance to campus ourselves \u2014 you do not have to estimate it, and students trust a measured number far more.",
    f:[["pin","Location","pin"]]},
   {k:'pr', h:"What are you charging?", ctx:true,
    f:[["rent","Rent per session (\u20A6)","rent-live"],
       ["neg","Negotiable?","sel",["Yes","No","Depends on the tenant"]]]},
   {k:'who', h:"Who runs the compound day to day?",
    hint:"If you have a caretaker, add them. They get paid per repair through Arzuz and build a public record.",
    o:["I do, myself","A caretaker","An agent","Nobody yet"]},
   {k:'ut', h:"What does the property have?",
    hint:"Tick everything that works. We check these when we verify.", c:UTILITIES},
   {k:'photo', h:"Add photos of the property",
    hint:"Optional but very effective \u2014 listings with photos get 3\u00d7 more enquiries. Take them from outside the building.",
    opt:true,
    f:[["photo","Property photo","photo"]]},
   {k:'ow', h:"Your details",
    hint:"Students reach you on this number. It stays hidden until someone contacts you.",
    f:[["nm","Your name","text"],["ph","WhatsApp number","tel"]]},
   {k:'vf', h:"Can we come and verify it?",
    hint:"Free, about 30 minutes. Inspected properties get significantly more enquiries.",
    o:["Yes, come and check it","Not right now"]}
  ],
  done:
   '<div class="done"><div class="m"><span>az</span></div><h3>Your listing is in.</h3>'+
   '<p>We review it within 24 hours and message you on WhatsApp.</p>'+
   '<div class="live" style="text-align:left"><b>61</b> students looking in Malete right now match '+
   'this property. They see it the moment it goes live.</div>'+
   '<div class="nav"><a class="next" href="index.html">Done</a></div></div>'
});

Arzuz.footer();
</script>
</body>
</html>
