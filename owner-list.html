<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>List Your Property — Arzuz Student Housing</title>
<meta name="description" content="List your student property on Arzuz. Now open in Malete, with more locations coming soon. Reach verified students looking for rooms. Free to list.">
<link rel="canonical" href="https://arzuz.com/list">
<link rel="icon" href="assets/icons/favicon.ico" sizes="any">
<link rel="icon" href="assets/icons/icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta property="og:title" content="List Your Property — Arzuz Student Housing">
<meta property="og:description" content="List your student property on Arzuz. Now open in Malete, with more locations coming soon.">  <meta property="og:image" content="https://arzuz.com/assets/social/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Arzuz — verified student hostels, zero agent fees">
  <meta property="og:url" content="https://arzuz.com/list">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Arzuz">
  <meta property="og:locale" content="en_NG">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="List Your Property — Arzuz Student Housing">
  <meta name="twitter:description" content="List your student property on Arzuz. Now open in Malete, with more locations coming soon.">
  <meta name="twitter:image" content="https://arzuz.com/assets/social/og-image.png">
  <meta name="twitter:image:alt" content="Arzuz — verified student hostels, zero agent fees">
<link rel="stylesheet" href="assets/arzuz.css">
<link rel="stylesheet" href="assets/share.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<div class="wrap pad"><div id="form"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/config.js"></script>
<script src="assets/data.js"></script>
<script src="assets/attribution.js"></script>
<script src="assets/notify.js"></script>
<script src="assets/submit.js?v=3"></script>
<script src="assets/share.js"></script>
<script src="assets/whatsapp.js"></script>
<script src="assets/arzuz-map.js?v=3"></script>
<script src="assets/app.js"></script>
<script src="assets/motion.js"></script>
<script>

Arzuz.chrome('owner');
ArzuzData.ready.then(function(){
Arzuz.form({
  table:'listings',
  backHref:'index.html', backLabel:'\u2190 Back to home',
  steps:[
   {k:'p', h:"About the property",
    hint:"Give us a name for the property if it has one \u2014 helps students recognise it. Everything else is required.",
    f:[["prop_name","Property name or nickname (e.g. Blessing Lodge)","text",{opt:true}],
       ["ty","Property type","sel",PROPERTY_TYPES],
       ["ar","Street or area name","text"],
       ["rm","Vacant rooms right now (0 if the place is full)","number"]]},
   {k:'pin', h:"Where exactly is it?",
    hint:"Drop a pin at your gate. We calculate the walking distance to campus ourselves \u2014 you do not have to estimate it, and students trust a measured number far more.",
    f:[["pin","Location","pin"]]},
   {k:'passage', h:"How does someone walk in?",
    hint:"Landmarks, the gate, the stairs — the things only someone who knows the compound can tell. Students find the place first time, without calling you twice.",
    opt:true,
    f:[["passage","Passage to the apartment","passage",{opt:true}]]},
   {k:'pr', h:"What are you charging?", ctx:true,
    f:[["rent","Rent per session (\u20A6)","rent-live"]]},
   {k:'who', h:"Who takes care of the property day to day?",
    hint:"Arzuz sends repairs and student messages to whoever runs the compound. Tell us who that is — the same four roles the dashboard files everyone under.",
    o:["Landlord","Caretaker","Agent","Admin"]},
   {k:'ut', h:"What does the property have?",
    hint:"Tick everything that works. We check these when we verify.", c:UTILITIES},
   {k:'photo', h:"Add photos of the property",
    hint:"Optional but very effective \u2014 listings with photos get 3\u00d7 more enquiries. Take them from outside the building.",
    opt:true,
    f:[["photo","Property photo","photo"]]},
   {k:'ow', h:"Your details",
    hint:"Students reach you on this number. It stays hidden until someone contacts you.",
    f:[["nm","Your first name","text"],["last","Your last name","text"],["ph","WhatsApp number","tel"]]},
   {k:'vf', h:"Can we come and verify it?",
    hint:"Free, about 30 minutes. Inspected properties get significantly more enquiries.",
    o:["Yes, come and check it","Not right now"]}
  ],
  done:
   '<div class="done"><div class="m"><span>az</span></div><h3>Your listing is in.</h3>'+
   '<p>We review it within 24 hours and message you on WhatsApp.</p>'+
   '<div class="live" style="text-align:left">'+
   (Arzuz.isReal()
     ? '<b>'+DEMAND_TOTAL+'</b> students are registered on Arzuz right now. '+
       'They see it the moment it goes live.'
     : 'As soon as your listing is live we will send you the real number of students looking in '+
       'your area for this property \u2014 we never show a count we cannot trace to a record.')+
   '</div>'+
   /* Supply is the constraint, so the landlord referral prompt matters
      more than the student one. Tagged `landlord-share` so we can see
      which compound actually recruited the next landlord. */
   ArzuzShare.card({
     url: 'https://arzuz.com/list',
     tag: 'landlord-share',
     heading: 'Know another landlord in Malete?',
     body: 'Send them this \u2014 listing is free, and the students come to them.',
     text: 'Arzuz lists student rooms near KWASU straight to verified students \u2014 free to list, no agent cut:'
   }) +
   '<div class="nav"><a class="next" href="index.html">Done</a></div></div>'
});
});

/* One delegated listener on the persistent #form container: the share
   card is injected by the form engine's done screen. */
ArzuzShare.wire(document.getElementById('form'));

Arzuz.footer();
</script>
</body>
</html>
