<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register Your Building — Arzuz Student Housing</title>
<meta name="description" content="Tell us about a student building. Starting in Malete, Kwara State, and expanding soon. Real rent prices, utilities and location, no agent fees.">
<link rel="canonical" href="https://arzuz.com/my-building">
<link rel="icon" href="assets/icons/favicon.ico" sizes="any">
<link rel="icon" href="assets/icons/icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta property="og:title" content="Register Your Building — Arzuz Student Housing">
<meta property="og:description" content="Share real rent prices and utilities for your building. Help students verify before they pay, starting in Malete and expanding soon.">
<meta property="og:image" content="https://arzuz.com/assets/social/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Arzuz — verified student hostels, zero agent fees">
<meta property="og:url" content="https://arzuz.com/my-building">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Arzuz">
<meta property="og:locale" content="en_NG">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Register Your Building — Arzuz">
<meta name="twitter:description" content="Share real rent prices and utilities for your building. Help students verify before they pay, starting in Malete.">
<meta name="twitter:image" content="https://arzuz.com/assets/social/og-image.png">
<meta name="twitter:image:alt" content="Arzuz — verified student hostels, zero agent fees">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "name": "Register Your Building — Arzuz",
  "description": "Submit verified student housing data. Starting in Malete, Kwara State, and expanding to more locations.",
  "url": "https://arzuz.com/my-building",
  "isPartOf": { "@type": "WebSite", "name": "Arzuz", "url": "https://arzuz.com" }
}
</script>
<link rel="stylesheet" href="assets/arzuz.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<div class="wrap pad"><div id="form"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/config.js"></script>
<script src="assets/data.js"></script>
<script src="assets/notify.js"></script>
<script src="assets/submit.js"></script>
<script src="assets/whatsapp.js"></script>
<script src="assets/app.js"></script>
<script>

Arzuz.chrome('student');
ArzuzData.ready.then(function(){
Arzuz.form({
  table:'scout_submissions',
  backHref:'index.html', backLabel:'\u2190 Back to home',
  steps:[
   {k:'where', h:"Where do you live?",
    f:[["area","Street or area name","text"],["rooms","How many rooms in the building?","number"]]},
   {k:'pin', h:"Drop a pin at the gate",
    hint:"Stand at the entrance and tap. This is how we work out the real walking distance to campus instead of trusting a guess.",
    f:[["pin","Location","pin"]]},
   {k:'paid', h:"What do you actually pay?",
    hint:"The real number for the session \u2014 not the asking price. We never show which tenant told us.",
    f:[["amt","Rent per session (\u20A6)","number"],["lp","Who collects your rent \u2014 number","tel"]]},
   {k:'who', h:"Who collects the rent?",
    hint:"Many owners never meet their tenants. This tells us who is actually running the compound.",
    o:["The owner","A caretaker","An agent","I am not sure"]},
   {k:'ut', h:"What does it actually have?", hint:"Only tick what genuinely works.", c:UTILITIES},
   {k:'photo', h:"Add a photo of the building",
    hint:"Optional but powerful \u2014 listings with a photo get 3\u00d7 more matches. Take it from outside the gate.",
    opt:true,
    f:[["photo","Building photo","photo"]]},
   {k:'vac', h:"Any room becoming free soon?",
    hint:"The most useful thing you can tell us \u2014 it reaches us before it reaches any agent.",
    o:["No","Yes, this month","Yes, next session","Not sure"]},
   {k:'ct', h:"Where should we reach you?",
    hint:"So we can credit you when a student moves in through your listing.",
    f:[["first","First name","text"],["last","Last name","text"],["phone","WhatsApp number","tel"]]}
  ],
  done:
   '<div class="done"><div class="m"><span>az</span></div><h3>That is genuinely useful.</h3>'+
   '<p>You know this building better than any agent does. We will verify it and add it with a '+
   '<b>Community verified</b> badge.</p>'+
   '<p class="sm">What you pay is stored privately and only ever shown combined with other tenants. '+
   'Your name is never attached to it.</p>'+
   '<div class="nav"><a class="next" href="index.html">Done</a></div></div>'
});
});

Arzuz.footer();
</script>
</body>
</html>
